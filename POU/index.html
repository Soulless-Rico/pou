<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pou Demo</title>
    <link rel="stylesheet" href="css/pou.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/health.css">
    <link rel="stylesheet" href="css/moneyRain.css">
    <link rel="stylesheet" href="css/casino.css">
</head>
<body>

    <div id="pou">

        <!-- Eyes -->
        <div class="eye left">
            <div class="pupil"></div>
        </div>
        <div class="eye right">
            <div class="pupil"></div>
        </div>

        <!-- Mouth (cigar attaches from here) -->
        <div id="mouth">
            <div id="smoke">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        <!-- Suit + Tie -->
        <div id="suit">
            <div id="tie"></div>
        </div>

        <!-- Hat Brim (must be inside pou!) -->
        <div class="hat-brim"></div>
    </div>

        <!-- Money rain container -->
    <div id="money-rain"></div>

    <!-- Skills from Skill tree -->
    <div id="skills"></div>
    
        <!-- Casino -->
    <div id="casino">
    <div id="slot-machine">
        <div class="reel" id="reel1"></div>
        <div class="reel" id="reel2"></div>
        <div class="reel" id="reel3"></div>
    </div>

    <div id="lever">
        <div id="lever-stick"></div>
        <div id="lever-knob"></div>
    </div>
    </div>

    <div id="slot-result"></div>

    <section>
        <fieldset>

            <div>
                <label>Hunger: <span id="hunger">Loading...</span></label>
                <button onclick="feed()">Feed</button>
            </div>

            <div>
                <label>Thrist: <span id="thirst">Loading...</span></label>
                <button onclick="drink()">Drink</button>
            </div>
            
            <div>
                <label>Energy: <span id="energy">Loading...</span></label>
                <button onclick="sleep()">Sleep</button>
            </div>

            <div>
                <label>Fun: <span id="fun">Loading...</span></label>
                <button onclick="playGTA()">Play GTA V</button>
            </div>

            <div>
                <label>Hygiene: <span id="hygiene">Loading...</span></label>
                <button onclick="washYourBalls()">Clean</button>
            </div>

            <div>
                <label>Coins: <span id="coins">Loading...</span></label>
                <button onclick="collectProfits()">Collect daily profits</button>
            </div>

            <div>
                <label>Level: <span id="level">Loading...</span></label>
                <button>i dunno</button>
            </div>

            <div>
                <label>Stress: <span id="stress">Loading...</span></label>
                <button onclick="smokeWeedEveryday()">Smoke Weed</button>    
            </div>

            <div>
                <label>Casino: <span id="casino-button"></span></label>
                <button id="spinBtn">SPIN (15 coins)</button>    
            </div>

        </fieldset>
    </section>

    <div id="main-health-container">
        <div id="main-health-bar"><span id="pouHealth">Loading...</span></div>
    </div>

    <script src="js/eyes.js"></script>
    <script src="js/app.js"></script>
    <script src="js/minigame.js"></script>

</body>
</html>
